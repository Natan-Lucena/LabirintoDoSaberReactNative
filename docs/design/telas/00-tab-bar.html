<!-- Fonte: Labirinto V4 Mobile - Offline.html (Claude Design, projeto fe9f5a5d-00c3-4254-9797-0fba2801a1f3), template desempacotado, linhas 2268-2277; extraído em 2026-09-24; referência visual, não código a importar; valores passam pelas adaptações aprovadas em G-17. -->
          <sc-if value="{{ showChrome }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;left:0;bottom:0;width:375px;height:64px;background:#fff;border-top:0.492px solid rgb(224,224,224);display:flex;align-items:center;padding:6px 4px;box-sizing:border-box">
            <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
              <div sc-camel-on-click="{{ t.onClick }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer">
                <div style="padding:3px 14px;border-radius:11063370px;background:{{ t.bg }};display:flex;align-items:center;justify-content:center;color:{{ t.fg }}">{{ t.svg }}</div>
                <span style="font:600 9px/13px Roboto,sans-serif;letter-spacing:0.5px;text-align:center;color:{{ t.fg }}">{{ t.label }}</span>
              </div>
            </sc-for>
          </div>
          </sc-if>
